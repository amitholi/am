[project]
name = "am"
version = "0.1.0"
description = "Python tooling for the am repo (crypto scanner script and friends)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "pytz>=2024.1",
    "termcolor>=2.4",
    "anthropic>=0.120.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
